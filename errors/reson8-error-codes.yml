  - code: NOT_FOUND
    status: 404
    meaning: Custom model not found.
    operations: [getCustomModel, listPhrases, addPhrases, deletePhrases]
  - code: PAYLOAD_TOO_LARGE
    status: 413
    meaning: Audio file exceeds the maximum size.
    operations: [transcribePrerecorded]
  - code: INTERNAL_ERROR
    status: 500
    meaning: Unexpected server error.
    operations: [requestToken, transcribePrerecorded, streamRealtime, streamTurns, createCustomModel, listCustomModels, getCustomModel, listPhrases, addPhrases, deletePhrases]
