name: Reson8
description: >-
  Reson8 (Resonate Labs B.V.) is a Balderton Capital-backed speech-recognition company
  offering an infrastructure-grade automatic speech recognition (ASR) API. Its
  differentiator is text-based, hyper-custom domain adaptation: feed up to ~1M tokens of
  domain vocabulary and a custom model adapts in under 60 seconds with no audio datasets
  or fine-tuning, cutting word error rate versus generic engines. The v1 API at
  api.reson8.dev provides realtime WebSocket streaming, turn-level events for
  conversational voice agents, prerecorded file transcription, speaker diarization, and
  custom-model phrase management across ten European languages, on EU-hosted
  infrastructure with zero audio retention.
